[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parabiont-protocol"
version = "0.1.0"
description = "Signed context carrier profile over A2A"
requires-python = ">=3.11"
dependencies = ["axionorm>=0.1,<0.2", "cryptography>=46,<47", "a2a-sdk==0.3.26", "uvicorn>=0.35,<1", "starlette>=0.45,<1", "httpx>=0.28,<1"]

[project.scripts]
parabiont = "parabiont.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
