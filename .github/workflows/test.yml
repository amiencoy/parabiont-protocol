name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: parabiont-protocol
      - uses: actions/checkout@v4
        with:
          repository: amiencoy/axionorm
          ref: v0.1.0
          path: axionorm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ./axionorm ./parabiont-protocol pytest pip-audit bandit
      - run: axionorm install-opa --directory axionorm/.runtime/opa
      - run: python -m pytest parabiont-protocol/tests -q
        env:
          AXIONORM_POLICY: axionorm/examples/technical-review.yaml
          OPA_BINARY: axionorm/.runtime/opa/opa
      - run: python -m bandit -q -r parabiont-protocol/src
      - run: python -m pip_audit
